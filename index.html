      <fr>
        <p class="bio-texte">Je m’intéresse aux approches expérimentales et interdisciplinaires de l’architecture. Ma démarche accorde une importance particulière au processus de conception, à l’exploration de différentes méthodes de représentation et de documentation, ainsi qu’à l’expérimentation comme outil de réflexion. Sensible aux enjeux sociaux, environnementaux et matériels, j’explore les relations entre l’existant, les ressources disponibles et les possibilités de transformation des milieux construits, notamment à travers le réemploi et&nbsp;l’adaptation.</p>
      </fr>
      <en>
        <p class="bio-texte">I am interested in experimental and interdisciplinary approaches to architecture. My practice places particular importance on the design process, on exploring different methods of representation and documentation, and on experimentation as a tool for reflection. Attentive to social, environmental and material issues, I explore the relationships between what already exists, available resources and the possibilities for transforming built environments, particularly through reuse and&nbsp;adaptation.</p>
      </en>

    <div class="p4-texte g" style="grid-row:1 / span 2">
      <fr>
        <h2 class="chapitre-nom">L'objet</h2>
        <p>Ce projet explore la transformation du bois à travers ses propriétés d’absorption et de dégradation, en croisant des pratiques de parasitage naturel et des interventions contrôlées. L’immersion, l’oxydation, la symbiose mycélienne ou l’anaské dialoguent avec l’application de solvants, colles et peintures, générant des hybridations successives qui révèlent les traces d’un processus de morphogenèse&nbsp;répété.</p>
        <p>La porosité du bois, accentuée par l’humidité et les agressions chimiques, devient un registre sensible où rainures et altérations témoignent de la matière en mutation. Fragile mais résilient, le bois agit comme un réceptacle silencieux de ces transformations, inscrivant le passage du temps dans sa&nbsp;surface.</p>
      </fr>
      <en>
        <h2 class="chapitre-nom">The object</h2>
        <p>This project explores the transformation of wood through its properties of absorption and degradation, combining natural parasitic processes with controlled interventions. Immersion, oxidation, mycelial symbiosis and anaské interact with the application of solvents, glues and paints, generating successive hybridizations that reveal the traces of a repeated process of&nbsp;morphogenesis.</p>
        <p>The porosity of the wood, heightened by moisture and chemical attacks, becomes a sensitive record in which grooves and alterations bear witness to a material in mutation. Fragile yet resilient, the wood acts as a silent receptacle for these transformations, inscribing the passage of time into its&nbsp;surface.</p>
      </en>
    </div>

      <fr>
        <h2 class="chapitre-nom">Le cyanotype</h2>
        <p>Ce travail est complété par l’utilisation du cyanotype, procédé photographique ancien dont le bleu profond révèle, par l’action de la lumière et de l’eau, les empreintes et strates issues de ces processus&nbsp;expérimentaux.</p>
      </fr>
      <en>
        <h2 class="chapitre-nom">The cyanotype</h2>
        <p>This work is completed by the use of cyanotype, an early photographic process whose deep blue reveals, through the action of light and water, the imprints and layers left by these experimental&nbsp;processes.</p>
      </en>
    </div>
    <figure class="espace-bas p4-img bord-g" style="grid-column:1 / span 6;grid-row:1;max-width:calc(var(--hmax) * 1.301)">

        <figcaption>Développement des cyanotypes</figcaption>
      </fr>
      <en>
        <span class="im" tabindex="0" role="button"><img src="images/projets/01-inspire/b-bain.jpg" alt="Developing the cyanotypes"><img class="scotch hd bleu" src="images/site/ruban-bleu.png" alt="" draggable="false" style="--t:-7deg"></span>
        <figcaption>Developing the cyanotypes</figcaption>

        <p>Cette analyse cartographique retrace l’évolution des contraintes environnementales et sociales ayant influencé les déplacements des Peuls entre 1950 et 2020 dans les régions de Waalo et de Jeeri au Sénégal. Dans les années 1950, les rythmes naturels, fondés sur des cycles climatiques relativement stables et lisibles, permettaient un nomadisme saisonnier prévisible, structuré par l’alternance des pluies, des crues et des périodes de&nbsp;sécheresse.</p>
        <p>Progressivement, l’intensification des aléas climatiques, combinée aux interventions anthropiques telles que l’expansion agricole, l’urbanisation et les conflits d’usage des terres, a rendu ces cycles de plus en plus imprévisibles. Cette perte de repères temporels et spatiaux a profondément modifié les pratiques de déplacement, entraînant une sédentarisation partielle autour des forages et des pôles&nbsp;économiques.</p>
        <p>Le territoire bascule ainsi d’un système fondé sur la prévisibilité des cycles naturels vers un paysage instable et incertain, appelant à des infrastructures capables de s’adapter à cette nouvelle condition&nbsp;d’imprévisibilité.</p>
      </fr>
      <en>
        <h2 class="chapitre-nom">Site analysis</h2>
        <p>This cartographic analysis traces the evolution of the environmental and social constraints that shaped the movements of the Fulani people between 1950 and 2020 in the Waalo and Jeeri regions of Senegal. In the 1950s, natural rhythms, based on relatively stable and legible climate cycles, allowed for a predictable seasonal nomadism, structured by the alternation of rains, floods and periods of&nbsp;drought.</p>
        <p>Gradually, the intensification of climate hazards, combined with human interventions such as agricultural expansion, urbanization and land-use conflicts, made these cycles increasingly unpredictable. This loss of temporal and spatial landmarks profoundly changed patterns of movement, leading to a partial settling around boreholes and economic&nbsp;hubs.</p>
        <p>The territory thus shifts from a system grounded in the predictability of natural cycles to an unstable and uncertain landscape, calling for infrastructure able to adapt to this new condition of&nbsp;unpredictability.</p>

        <p>Le projet propose une école du futur inscrite dans une trame spatiale dynamique, où des éléments fixes, ancrés dans la mémoire du territoire, coexistent avec des éléments mobiles soumis aux forces du vent, aux usages et aux mouvements des élèves. Un tissu architectural, tendu entre des poteaux, se déforme et se reconfigure en fonction des conditions du moment, générant des espaces temporaires, évolutifs et sensibles à leur&nbsp;environnement.</p>
      </fr>
      <en>
        <h2 class="chapitre-nom">A dynamic potential</h2>

        <p>The project proposes a school of the future set within a dynamic spatial grid, where fixed elements, anchored in the memory of the territory, coexist with mobile elements subject to the forces of the wind, to uses and to the movements of the students. An architectural fabric, stretched between posts, deforms and reconfigures itself according to the conditions of the moment, generating temporary, evolving spaces that respond to their&nbsp;environment.</p>

        <p class="trois"><span>Stocker.</span><span>Assembler.</span><span>Attacher.</span></p>
        <p>Une crise anticipée, un rituel annuel, une journée entre urgence et quotidien. Dans cette instabilité, le diable approche une retraite bien méritée. Marqué par le passage perpétuel des lits, des robinets, des tables, il se dénature. (Ré)employé de manière improbable, le chariot se travestit en mobilité meublée, c’est à son tour d’entreposer. Falsifiant son usage initial, il porte les rebuts d’un changement d’adresse. Les sangles supportent. Les cartons encaissent. Le diable roule. Sa fonction initiale se suspend, l’usage se déplace. Au final peut-être que rien ne se crée, rien ne se perd, et que tout se transforme. La transition n’est plus&nbsp;: réemployer, c’est rénover le rituel. On se réconforte dans l’idée de vivre dans ses&nbsp;boîtes.</p>

      <en>
        <p>And then July 1st arrives, and with it the dread of a day full of&nbsp;pitfalls.</p>
        <p class="trois"><span>Store.</span><span>Assemble.</span><span>Strap.</span></p>
        <p>An anticipated crisis, an annual ritual, a day caught between emergency and the everyday. In this instability, the hand truck nears a well-earned retirement. Worn by the endless passage of beds, faucets and tables, it loses its nature. (Re)used in an unlikely way, the cart disguises itself as furnished mobility; now it is its turn to store. Falsifying its original use, it carries the leftovers of a change of address. The straps hold. The boxes take the blows. The hand truck rolls. Its original function is suspended, its use shifts. In the end, perhaps nothing is created, nothing is lost, and everything is transformed. The transition is no more: to reuse is to renew the ritual. We find comfort in the idea of living in our&nbsp;boxes.</p>
        <p>And then July 1st is&nbsp;here.</p>
      </en>

        <p>La maquette du projet a été réalisée à l’échelle 1:50 afin de représenter précisément la structure et l’organisation spatiale du Centre national du film du Québec. La fabrication s’est appuyée sur la modélisation et l’impression 3D, permettant de produire les différentes pièces structurelles avec précision, notamment les éléments répétitifs et les assemblages&nbsp;complexes.</p>
        <p>Chaque composante a été imprimée séparément, puis assemblée manuellement afin de reconstruire la structure du projet. Cette méthode a permis de tester concrètement la relation entre les différents éléments, les circulations et les volumes, tout en rendant visibles les détails de la structure. La maquette devient ainsi un outil d’exploration et de compréhension du projet autant qu’un objet de&nbsp;représentation.</p>
      </fr>
      <en>
        <h2 class="chapitre-nom">The 1:50 model</h2>
        <p>The project model was made at a 1:50 scale to accurately represent the structure and spatial organization of the Québec National Film Centre. Its fabrication relied on 3D modelling and printing, making it possible to produce the various structural parts precisely, especially the repetitive elements and complex&nbsp;assemblies.</p>
        <p>Each component was printed separately, then assembled by hand to rebuild the structure of the project. This method made it possible to test, in a concrete way, the relationship between the different elements, circulation and volumes, while making the details of the structure visible. The model thus becomes as much a tool for exploring and understanding the project as an object of&nbsp;representation.</p>
      </en>
